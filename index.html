<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarys Consultoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #eebc18;
            --blue: #00bcd4;
            --dark: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Fundo com leve gradiente para profundidade */
            background: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--dark);
        }

        /* Formas abstratas de fundo para tirar a "graça" do branco puro */
        body::before {
            content: "";
            position: absolute;
            background: rgba(238, 188, 24, 0.05);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        .logo-box {
            animation: slideDown 1s ease-out;
        }

        .logo-img {
            max-width: 300px;
            width: 100%;
            height: auto;
            /* Filtro leve para garantir que cores fiquem vivas */
            filter: contrast(1.05);
        }

        .content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 15px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #1a1a1a 0%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* A Barrinha Colorida - Agora com destaque e animação */
        .brand-line {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--gold), var(--blue), var(--gold));
            background-size: 200% auto;
            border-radius: 10px;
            margin: 20px auto;
            box-shadow: 0 10px 20px rgba(0, 188, 212, 0.15);
            animation: shine 4s linear infinite;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
            font-weight: 700;
        }

        /* Animações */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Efeito de entrada do texto */
        .content {
            animation: fadeIn 1.5s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="image.jpeg" alt="ZARYS" class="logo-img">
        </div>

        <div class="content">
            <p>Vamos impulsionar o seu crescimento. Prepare-se para algo novo.</p>
            
            <div class="brand-line"></div>
            
            <footer>
                Lançamento em 2026
            </footer>
        </div>
    </div>

</body>
</html>
